<style>
:root{
  /* Layout: one column. Tower canvas on top, selected slot under it, lists in tabs. Single dark theme: the cellar at night. */
  color-scheme: dark;
  --bg:#141112;
  --panel:#1e1a1b;
  --panel-2:#292324;
  --line:#3a3133;
  --text:#efe7e2;
  --muted:#a3958f;
  --brass:#c9a36a;
  --led:#ff3b30;
  --ok:#5fb89a;
  --low:#e8a93c;
  --out:#ff5a4f;
  --unk:#7c7072;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4}
body{padding:14px 16px 40px;max-width:760px;margin:0 auto}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#sync{font-size:13px;color:var(--muted)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.summary{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{flex:1 1 70px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:70px}
.chip b{display:block;font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.chip span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:var(--ok)}.d-low{background:var(--low)}.d-out{background:var(--out)}.d-unk{background:var(--unk)}.d-empty{background:transparent;border:1px solid var(--unk)}
#search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#search::placeholder{color:var(--muted)}
#results{margin-top:6px}
.res{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.res .dot{margin-top:6px}
.res .rn{flex:1;min-width:0;display:flex;flex-direction:column}
.res .rc{text-align:right;display:flex;flex-direction:column;flex:none}
.res .rc b{font-family:var(--display);font-size:20px;color:var(--brass);line-height:1.1}
.res small{color:var(--muted);font-size:12.5px}
button:disabled,input:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;margin:12px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 2px;font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--led)}
.view{display:none}.view.on{display:block}
.solo [data-v="usage"]{display:none}
#stage{position:relative;background:radial-gradient(ellipse at 50% 40%,#2a1b1c 0%,#161213 70%);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#cv{display:block;width:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button,.faces button{background:rgba(30,26,27,.85);border:1px solid var(--line);border-radius:8px;min-width:40px;height:40px;font-family:var(--display);font-size:18px;font-weight:600}
.bar2{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.faces{display:flex;gap:6px}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(30,26,27,.9)}
.modes button{background:none;border:0;height:40px;padding:0 12px;font-family:var(--display);font-size:17px;font-weight:600;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--brass);color:#141112}
.faces button{padding:0 9px;min-width:0}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
#detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
#detail .top{display:flex;align-items:center;gap:10px}
.code{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;border:1px solid currentColor}
.s-ok{color:var(--ok)}.s-low{color:var(--low)}.s-out{color:var(--out)}.s-unk{color:var(--muted)}.s-empty{color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button,.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px}
#dName{width:100%;margin:10px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:17px;font-weight:500}
.rowctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctl label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.step button{background:var(--panel-2);border:0;width:46px;font-size:22px;font-weight:600}
.step input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:0;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;padding:6px 0}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;font-weight:600}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.sheetwrap{overflow-x:auto}
.cell{display:flex;gap:6px;align-items:baseline;background:none;border:0;padding:0;text-align:left;width:100%}
.cell .dot{position:relative;top:0}
.cell small{color:var(--muted);font-variant-numeric:tabular-nums}
.rown{font-family:var(--display);font-weight:600;font-size:16px;color:var(--brass)}
h2{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brass)}
.empty{color:var(--muted);padding:18px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--text)}
#copyOut{width:100%;min-height:120px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;margin-top:8px;display:none;font:13px/1.4 ui-monospace,monospace;padding:8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
</style>
</head>
<body>
<header>
  <h1>Wine Tower</h1>
  <div id="sync">Loading…</div>
</header>

<div class="summary" id="summary"></div>
<div id="src" class="note" style="margin:-4px 0 10px"></div>
<input id="search" type="search" placeholder="Find a wine or slot (e.g. Caymus, 127B)" autocomplete="off" aria-label="Find a wine or slot">
<div id="results"></div>

<div class="tabs" role="tablist">
  <button role="tab" data-v="tower" aria-selected="true">Tower</button>
  <button role="tab" data-v="sheet" aria-selected="false">Sheet</button>
  <button role="tab" data-v="restock" aria-selected="false">Restock</button>
  <button role="tab" data-v="usage" aria-selected="false">Usage</button>
</div>

<section class="view on" id="v-tower">
  <div class="bar2">
    <div class="modes" id="modes"><button data-m="out" aria-pressed="true">Outside</button><button data-m="in" aria-pressed="false">Inside</button></div>
    <div class="faces" id="faces" aria-label="Turn to a wall"></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" aria-label="Show whole tower" style="font-size:13px">FIT</button>
    </div>
  </div>
  <p class="hint" id="hint">You are looking through the glass, so columns run C, B, A left to right, the mirror of inside. Pinch to zoom in until the names show.</p>
  <div id="detail"></div>
</section>

<section class="view" id="v-sheet"></section>
<section class="view" id="v-restock"></section>
<section class="view" id="v-usage"></section>

<script src="wines.js"></script>
<script src="counts.js"></script>
<script>

const SHEET = {

};
const FACE_OF = {"100":0,"200":1,"300":2};   // 0 front, 1 left, 2 back
const FACE_YAW = [0,-Math.PI/2,Math.PI,Math.PI/2];

/* ---------- state ---------- */
function defaultState(){
  const s={v:1,rev:0,sections:[],slots:{},log:[]};
  for(const sid of Object.keys(SHEET)){
    const sec=SHEET[sid], rows=Object.keys(sec.rows).map(Number).sort((a,b)=>a-b);
    s.sections.push({id:sid,cols:sec.cols.slice(),rows});
    for(const r of rows) sec.cols.forEach((c,i)=>{ s.slots[r+c]={n:sec.rows[r][i]||"",c:null,p:1}; });
  }
  return s;
}
let S=defaultState();
let sel="118B", query="", usageDays=7;
const LS="toca-tower-v1";

function slotList(){ const out=[]; for(const sec of S.sections) for(const r of sec.rows) for(const c of sec.cols) out.push({id:r+c,row:r,col:c,sec}); return out; }
function slot(id){ return S.slots[id]||{n:"",c:null,p:1}; }
let WIDX={}, HAY={}, HIT=null;
function nrm(t){ return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
function reindex(){ WIDX={}; HAY={};
  for(const s of slotList()){ const d=S.slots[s.id]; if(!d) continue; if(d.w)(WIDX[d.w]=WIDX[d.w]||[]).push(s.id); HAY[s.id]=nrm(s.id+" "+d.n+" "+(d.w||"")+" "+(d.vt||"")); }
  const toks=nrm(query).split(/\s+/).filter(Boolean);
  HIT=toks.length?new Set(Object.keys(HAY).filter(id=>toks.every(t=>HAY[id].includes(t)))):null; }
function sibs(id){ const w=slot(id).w; return (w&&WIDX[w])||[id]; }
function prune(){ const ids=new Set(slotList().map(s=>s.id)); for(const k of Object.keys(S.slots)) if(!ids.has(k)) delete S.slots[k]; }
function status(id){ const s=slot(id); if(!s.n) return "empty"; if(s.c==null) return "unk"; if(s.c<=0) return "out"; const need=sibs(id).reduce((a,k)=>a+slot(k).p,0); if(s.c<need) return "low"; return "ok"; }
function applySync(y){
  if(!y||!y.items||!(y.t>(S.syncT||0))) return false;
  for(const id in y.items){ const s=S.slots[id], it=y.items[id]; if(!s||!it) continue;
    if(it.n!=null) s.n=it.n; if("c" in it) s.c=(it.c==null?null:it.c);
    if("p" in it) s.p=it.p;
    if("w" in it){ if(it.w) s.w=it.w; else delete s.w; } if("vt" in it){ if(it.vt) s.vt=it.vt; else delete s.vt; } }
  if(y.clearLogBefore) S.log=S.log.filter(e=>e.t>=y.clearLogBefore);
  S.syncT=y.t; S.sync={src:y.src||"",audit:y.audit||"",t:y.t};
  return true;
}
const LABEL={ok:"Stocked",low:"Below par",out:"Out",unk:"Not counted",empty:"Open slot"};
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function matches(id){ return !!HIT&&HIT.has(id); }

/* ---------- persistence: shared store when available, this device otherwise ---------- */
let db=null, docRef=null, saveTimer=null, saving=false, dirty=false, stateReady=false, pendingSync=null, readOnly=false, lastRemote=null, lastSync=null, fails=0;
const syncEl=document.getElementById("sync");
function setSync(t){ syncEl.textContent=t; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function loadLocal(){ try{ const t=localStorage.getItem(LS); if(t){ const o=JSON.parse(t); if(o&&o.slots&&o.sections){ S=o; prune(); } } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function touch(){ if(readOnly) return; S.rev=Date.now(); saveLocal(); dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(push,900); if(!db) setSync("Saved on this device"); else setSync("Saving…"); }
function goReadOnly(){ // this person can look and search but not change the shared counts
  readOnly=true; dirty=false; clearTimeout(saveTimer); setSync("View only");
  if(lastRemote){ S=clone(lastRemote); prune(); } if(lastSync) applySync(lastSync); renderAll();
}
async function push(){
  if(!docRef||saving||!dirty||readOnly) return;
  saving=true; dirty=false;

cv.addEventListener("wheel",e=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.12:.89); },{passive:false});
document.getElementById("zin").onclick=()=>zoomBy(1.4);
document.getElementById("zout").onclick=()=>zoomBy(1/1.4);
document.getElementById("zfit").onclick=()=>{ if(mode==="in") go({izoom:1,eye:EYE0}); else go({zoom:1,pan:0}); };
function setMode(m){ mode=m; try{ localStorage.setItem(LS+"-mode",m); }catch(e){} target=null;
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  document.getElementById("hint").textContent=m==="in"?"You are standing inside with the door behind you. Drag to look around and to move up or down. Columns read A, B, C left to right in here.":"You are looking through the glass, so columns run C, B, A left to right, the mirror of inside. Pinch to zoom in until the names show.";
  draw(); }
document.getElementById("modes").onclick=e=>{ const b=e.target.closest("button"); if(b) setMode(b.dataset.m); };
function whereText(id){
  const s=slotList().find(x=>x.id===id); if(!s||!LAY[s.sec.id]) return "";
  const f=FACE_OF[s.sec.id], side=["on your left as you walk in","straight ahead as you walk in","on your right as you walk in"][f]||"";
  const n=s.sec.cols.length, ci=s.sec.cols.indexOf(s.col), pos=n<2?"":(ci===0?"Left":ci===n-1?"Right":"Middle")+" spot, ";
  const L=LAY[s.sec.id], ri=s.sec.rows.indexOf(s.row), high=L.y[ri]+L.h[ri]/2>DOOR_U;
  return s.sec.id+"s wall, "+side+". "+pos+"row "+(ri+1)+" up from the floor, "+(high?"above the door top, so bring the ladder.":"below the door top.");
}

/* ---------- panels ---------- */
function renderSummary(){
  const n={ok:0,low:0,out:0,unk:0}; for(const s of slotList()){ const st=status(s.id); if(n[st]!=null) n[st]++; }
  document.getElementById("summary").innerHTML=
   `<div class="chip"><b>${n.out}</b><span><i class="dot d-out"></i>Out</span></div>
    <div class="chip"><b>${n.low}</b><span><i class="dot d-low"></i>Below par</span></div>
    <div class="chip"><b>${n.ok}</b><span><i class="dot d-ok"></i>Stocked</span></div>
    <div class="chip"><b>${n.unk}</b><span><i class="dot d-unk"></i>Not counted</span></div>`;
  document.getElementById("src").textContent=S.sync?("Counts from "+S.sync.src+" "+S.sync.audit+". Loaded "+new Date(S.sync.t).toLocaleString(undefined,{month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})+"."):"";
}
function renderFaces(){ document.getElementById("faces").innerHTML=S.sections.map(s=>`<button data-f="${FACE_OF[s.id]??0}">${s.id}s</button>`).join("")+`<button data-f="3">Door</button>`; }
document.getElementById("faces").onclick=e=>{ const b=e.target.closest("button"); if(b) turnTo(+b.dataset.f); };
function renderDetail(keepFocus){
  if(keepFocus&&document.activeElement&&document.activeElement.id==="dName") return;
  const s=slot(sel), st=status(sel);
  document.getElementById("detail").innerHTML=
   `<div class="top"><span class="code">${esc(sel)}</span><span class="pill s-${st}">${LABEL[st]}</span>
      <div class="nav"><button id="prev" aria-label="Slot below">▼</button><button id="next" aria-label="Slot above">▲</button></div></div>
    <input id="dName" type="text" value="${esc(s.n)}" placeholder="Wine in this slot" aria-label="Wine in this slot"${readOnly?" disabled":""}>
    ${s.w?`<p class="note" style="margin:-4px 0 10px">Bevager: ${esc(s.w)}${s.vt?" · "+esc(s.vt):""}${sibs(sel).length>1?" · stock shared with "+sibs(sel).filter(k=>k!==sel).join(", "):""}</p>`:""}
    <div class="rowctl">
      <div class="ctl"><label for="dCount">On hand</label><div class="step"><button id="minus" aria-label="Pulled one bottle">−</button><input id="dCount" inputmode="numeric" value="${s.c==null?"":s.c}" placeholder="?"><button id="plus" aria-label="Added one bottle">+</button></div></div>
      <div class="ctl"><label for="dPar">Par</label><div class="step"><button id="pminus" aria-label="Lower par">−</button><input id="dPar" inputmode="numeric" value="${s.p}"><button id="pplus" aria-label="Raise par">+</button></div></div>
    </div>
    <p class="note" style="color:var(--text)">${esc(whereText(sel))}</p>
    <p class="note">${readOnly?"View only. You can search and look, but counts can only be changed by an editor.":"− logs a bottle pulled and + logs a bottle added. Typing a number corrects the count without logging."}</p>`;
  if(readOnly) document.querySelectorAll("#detail .step button, #detail .step input").forEach(x=>{ x.disabled=true; });
  const $=id=>document.getElementById(id);
  $("minus").onclick=()=>pull(sel); $("plus").onclick=()=>add(sel);
  $("pminus").onclick=()=>setPar(sel,slot(sel).p-1); $("pplus").onclick=()=>setPar(sel,slot(sel).p+1);
  $("dCount").onchange=e=>setCount(sel,e.target.value); $("dPar").onchange=e=>setPar(sel,e.target.value);
  $("dName").onchange=e=>setName(sel,e.target.value);
  $("prev").onclick=()=>step(-1); $("next").onclick=()=>step(1);
}
function step(d){ const all=slotList().filter(x=>x.col===sel.replace(/^\d+/,"")&&x.sec.rows.includes(parseInt(sel))); const i=all.findIndex(x=>x.id===sel); const n=all[i+d]; if(n){ sel=n.id; renderAll(); focusSlot(sel,true); } }
function renderSheet(){
  let h="";
  for(const sec of S.sections){
    h+=`<h2>${sec.id}s ${readOnly?"":`<button class="btn" data-add="${sec.id}">Add row on top</button>`}</h2><div class="sheetwrap"><table><thead><tr><th>#</th>${sec.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`;
    for(const r of sec.rows.slice().reverse()){
      h+=`<tr><td class="rown">${r}</td>`+sec.cols.map(c=>{ const id=r+c,s=slot(id),st=status(id); if(query&&!matches(id)) return `<td style="opacity:.3"><button class="cell" data-slot="${id}"><i class="dot d-${st}"></i><span>${esc(s.n||"open")}</span></button></td>`;
        return `<td><button class="cell" data-slot="${id}"><i class="dot d-${st}"></i><span>${esc(s.n||"open")} <small>${s.n?(s.c==null?"?":s.c)+"/"+s.p:""}</small></span></button></td>`; }).join("")+`</tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  h+=`<p class="note">Top of the tower is listed first. Columns read A, B, C left to right when you stand inside facing that wall. Tap a wine to open its slot on the tower.</p>`;
  const el=document.getElementById("v-sheet"); el.innerHTML=h;
}
document.getElementById("v-sheet").onclick=e=>{ const a=e.target.closest("[data-add]"); if(a){ addRow(a.dataset.add); showView("tower"); focusSlot(sel,true); return; }
  const b=e.target.closest("[data-slot]"); if(b&&S.slots[b.dataset.slot]){ sel=b.dataset.slot; showView("tower"); renderAll(); focusSlot(sel,true); } };
function restockRows(){
  const by={}; for(const s of slotList()){ const st=status(s.id); if(st!=="low"&&st!=="out") continue; const d=slot(s.id); const k=(d.w||d.n).toLowerCase(); const g=(by[k]=by[k]||{n:d.n,w:d.w,slots:[],have:0,par:0}); g.slots.push(s.id); g.have=d.w?d.c:g.have+d.c; g.par+=d.p; }
  return Object.values(by).map(x=>({...x,need:x.par-x.have})).sort((a,b)=>(a.have===0?0:1)-(b.have===0?0:1)||b.need-a.need||a.n.localeCompare(b.n));
}
function renderRestock(){
  const rows=restockRows(), unk=slotList().filter(s=>status(s.id)==="unk").length;
  let h=`<div class="toolbar"><button class="btn" id="copy">Copy restock list</button><span class="note" id="copied" style="margin:0"></span></div><textarea id="copyOut" readonly aria-label="Restock list text"></textarea>`;
  if(!rows.length) h+=`<p class="empty">Nothing counted is below par.</p>`;
  else h+=`<table><thead><tr><th>Wine</th><th>Slots</th><th class="num">Have</th><th class="num">Par</th><th class="num">Bring</th></tr></thead><tbody>`+rows.map(r=>`<tr><td><i class="dot d-${r.have===0?"out":"low"}"></i> ${esc(r.n)}${r.w?`<br><small style="color:var(--muted)">${esc(r.w)}</small>`:""}</td><td>${r.slots.map(id=>`<button class="cell" data-slot="${id}" style="display:inline;width:auto;color:var(--brass)">${id}</button>`).join(" ")}</td><td class="num">${r.have}</td><td class="num">${r.par}</td><td class="num"><b>${r.need}</b></td></tr>`).join("")+`</tbody></table>`;
  if(unk) h+=`<p class="note">${unk} slots have no count yet, so they cannot show up here. Count them on the Tower tab.</p>`;
  const el=document.getElementById("v-restock"); el.innerHTML=h;
  document.getElementById("copy").onclick=()=>{ const txt=rows.length?"Tower restock "+new Date().toLocaleDateString()+"\n"+rows.map(r=>`${r.need} x ${r.w||r.n} (${r.slots.join(", ")}) have ${r.have}, par ${r.par}`).join("\n"):"Tower restock: nothing below par.";
    const out=document.getElementById("copyOut"), msg=document.getElementById("copied");
    const fallback=()=>{ out.style.display="block"; out.value=txt; out.select(); msg.textContent="Select the text below and copy it."; };
    try{ navigator.clipboard.writeText(txt).then(()=>{ msg.textContent="Copied."; },fallback); }catch(e){ fallback(); } };
}
document.getElementById("v-restock").addEventListener("click",e=>{ const b=e.target.closest("[data-slot]"); if(b&&S.slots[b.dataset.slot]){ sel=b.dataset.slot; showView("tower"); renderAll(); focusSlot(sel,true); } });
function renderUsage(){
  const since=Date.now()-usageDays*864e5, by={};
  for(const ev of S.log){ if(ev.d>=0||ev.t<since) continue; const k=(ev.n||ev.id).toLowerCase(); (by[k]=by[k]||{n:ev.n||ev.id,q:0,last:0}); by[k].q+=-ev.d; by[k].last=Math.max(by[k].last,ev.t); }
  const rows=Object.values(by).sort((a,b)=>b.q-a.q), max=rows.length?rows[0].q:1, total=rows.reduce((a,r)=>a+r.q,0);
  let h=`<div class="toolbar"><div class="seg">${[7,30,90].map(d=>`<button data-d="${d}" class="${d===usageDays?"on":""}">${d} days</button>`).join("")}</div><span class="note" style="margin:0">${total} bottles pulled</span></div>`;
  if(!rows.length) h+=`<p class="empty">No bottles pulled in this window. Each tap of − on a slot is logged here.</p>`;
  else h+=`<table><thead><tr><th>Wine</th><th class="num">Pulled</th><th class="num">Per week</th><th class="num">Last</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${esc(r.n)}<div class="bar"><i style="width:${Math.round(r.q/max*100)}%"></i></div></td><td class="num">${r.q}</td><td class="num">${(r.q/usageDays*7).toFixed(1)}</td><td class="num">${new Date(r.last).toLocaleDateString(undefined,{month:"numeric",day:"numeric"})}</td></tr>`).join("")+`</tbody></table>`;
  const el=document.getElementById("v-usage"); el.innerHTML=h;
  el.querySelector(".seg").onclick=e=>{ const b=e.target.closest("button"); if(b){ usageDays=+b.dataset.d; renderUsage(); } };
}
function shortWhere(id){
  const s=slotList().find(x=>x.id===id); if(!s||!LAY[s.sec.id]) return "";
  const side=["on your left","straight ahead","on your right"][FACE_OF[s.sec.id]]||"", n=s.sec.cols.length, ci=s.sec.cols.indexOf(s.col), L=LAY[s.sec.id], ri=s.sec.rows.indexOf(s.row);
  return s.sec.id+"s wall "+side+", "+(n<2?"":(ci===0?"left":ci===n-1?"right":"middle")+" spot, ")+"row "+(ri+1)+(L.y[ri]+L.h[ri]/2>DOOR_U?", needs the ladder":"");
}
function renderResults(){
  const el=document.getElementById("results"); if(!HIT){ el.innerHTML=""; return; }
  const ids=slotList().map(s=>s.id).filter(id=>HIT.has(id));
  if(!ids.length){ el.innerHTML=`<p class="note">Nothing in the tower matches “${esc(query)}”.</p>`; return; }
  el.innerHTML=ids.slice(0,8).map(id=>{ const s=slot(id), st=status(id);
    return `<button class="res" data-slot="${id}"><i class="dot d-${st}"></i><span class="rn"><b>${esc(s.n||"open")}</b>${s.w&&nrm(s.w)!==nrm(s.n)?`<small>${esc(s.w)}${s.vt?" · "+esc(s.vt):""}</small>`:""}<small>${esc(shortWhere(id))}</small></span><span class="rc"><b>${esc(id)}</b><small>${st==="empty"?"":s.c==null?"not counted":s.c<=0?"out":s.c+" on hand"}</small></span></button>`; }).join("")
    +(ids.length>8?`<p class="note">${ids.length-8} more. Keep typing to narrow it down.</p>`:"");
}
document.getElementById("results").onclick=e=>{ const b=e.target.closest("[data-slot]"); if(!b||!S.slots[b.dataset.slot]) return; sel=b.dataset.slot; document.getElementById("search").blur(); showView("tower"); renderAll(); focusSlot(sel,true); document.getElementById("stage").scrollIntoView({block:"nearest"}); };
function renderAll(keepFocus){ reindex(); relayout(); renderSummary(); renderResults(); renderFaces(); renderDetail(keepFocus); renderSheet(); renderRestock(); renderUsage(); draw(); }
function showView(v){ document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v)); document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v)); if(v==="tower") resize(); }
document.querySelector(".tabs").onclick=e=>{ const b=e.target.closest("button"); if(b) showView(b.dataset.v); };
document.getElementById("search").addEventListener("input",e=>{ query=e.target.value.trim(); reindex(); const hits=slotList().filter(s=>matches(s.id)); if(hits.length){ sel=hits[0].id; renderAll(); if(document.getElementById("v-tower").classList.contains("on")) focusSlot(sel,hits.length<=3); } else renderAll(); });
window.addEventListener("resize",resize);
initStore(); resize(); setMode(mode);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
</script>
</body>
</html>
