<style>
:root{
  /* Cellar at night: warm charcoal, champagne gold accent. Color appears only where something needs attention. */
  color-scheme: dark;
  --bg:#121011;
  --panel:#1C1819;
  --panel-2:#252020;
  --sheet:#1A1617;
  --line:#2E2927;
  --line-2:#3A322E;
  --text:#F3EDE5;
  --muted:#A89D93;
  --accent:#D6BE8C;
  --accent-ink:#121011;
  --brass:#D6BE8C;
  --led:#E0473C;
  --ok:#8FC2A4;
  --low:#E8A83E;
  --out:#EF6457;
  --unk:#7c7072;
  --pull:#D6BE8C;
  --serif:"Cormorant Garamond",Georgia,serif;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:78px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4}
body{padding:14px 16px calc(var(--navh) + 28px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled,input:disabled{opacity:.45;cursor:default}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 4px 2px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--serif);font-weight:600;font-size:32px;line-height:1;letter-spacing:0}
.livestat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding-bottom:4px;max-width:55%;text-align:right}
.livestat i{width:7px;height:7px;border-radius:50%;background:var(--text);flex:none}
body.offline .livestat i{background:var(--low)}

/* status pills */
#pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.pill2{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border:1px solid var(--line-2);border-radius:99px;background:none;font-size:13px;font-weight:500;color:var(--text)}
.pill2 i{width:7px;height:7px;border-radius:50%;flex:none}
.pill2.quiet{color:var(--muted)}

/* search */
.search{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:0 14px;min-height:48px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px}
.search svg{flex:none}
#search{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:16px;padding:12px 0}
#search::placeholder{color:#8E847B}
#results{margin-top:6px}
.res{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.res .rn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.res .rn b{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.1}
.res .rc{text-align:right;display:flex;flex-direction:column;flex:none;align-items:flex-end}
.res .rc b{font-family:var(--display);font-size:21px;font-weight:700;color:var(--accent);line-height:1.05;letter-spacing:.03em}
.res small{color:var(--muted);font-size:12.5px}
.res .fl{font-weight:600}

/* segmented controls */
.seg{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:#2C2624;color:var(--text);font-weight:600}
#modes{margin-top:12px}

/* wall row */
.wallrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0 8px}
.wallrow button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--muted);border-radius:50%}
.wallrow .wt{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.wallrow .wt b{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1}
.wallrow .wt span{font-size:12px;color:var(--muted)}

/* tower canvas */
#stage{position:relative;background:radial-gradient(ellipse at 50% 35%,#1d1718 0%,#121011 75%);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cv{display:block;width:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{background:rgba(28,24,25,.88);border:1px solid var(--line-2);border-radius:10px;width:44px;height:44px;font-family:var(--display);font-size:18px;font-weight:600;color:var(--text)}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0;text-align:center}

/* wall view: flat tiles */
#wall{overflow-y:auto;overscroll-behavior:contain;border-radius:14px;-webkit-overflow-scrolling:touch}
.wgrid{display:grid;gap:6px;padding:2px 0 8px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:3px;min-height:60px;padding:7px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:left;color:var(--text);min-width:0}
.tile .tt{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .tc{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--muted)}
.tile .tf{font-size:11px;font-weight:600;white-space:nowrap}
.tile .tn{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile.open .tn{color:#7c7072;font-style:italic;font-weight:500}
.tile.open{border-style:dashed;background:none}
.tile.f-red{border-color:rgba(239,100,87,.6);background:#1F1615}
.tile.f-red .tf{color:var(--out)}
.tile.f-amb{border-color:rgba(232,168,62,.55)}
.tile.f-amb .tf{color:var(--low)}
.tile.hit{border-color:rgba(214,190,140,.7)}
.tile.dim{opacity:.28}
.tile.sel{border:1.5px solid var(--accent);background:#231E1C;box-shadow:0 0 0 3px rgba(214,190,140,.16)}
.tile.sel .tc{color:var(--accent);font-weight:700}
.tile.pull{box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(214,190,140,.45)}
.doorline{grid-column:1/-1;display:flex;align-items:center;gap:8px;height:14px}
.doorline::before,.doorline::after{content:"";flex:1;border-top:1px dashed rgba(214,190,140,.55)}
.doorline span{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap}

/* pulls from Toast */
#pulls{border:1px solid var(--accent);border-radius:14px;background:var(--panel);padding:10px 12px;margin:12px 0 0;box-shadow:0 0 0 1px rgba(214,190,140,.12),0 0 18px rgba(214,190,140,.1)}
#pulls .ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#pulls .ph b{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--accent)}
#pulls .ph .n{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#pulls .ph .snd{margin-left:auto;min-height:36px;padding:4px 10px;font-size:13px}
.pr{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pr .pi{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.pr .pi b{font-family:var(--serif);font-size:19px;font-weight:600;overflow-wrap:anywhere}
.pr .pi small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pr .pi .pc{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);letter-spacing:.03em}
.pr .got{flex:none;min-height:46px;min-width:86px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:600}
.pr.done{opacity:.55}
.pr.done .got{background:var(--panel-2);color:var(--text);border:1px solid var(--line-2);font-size:14px}
@media (prefers-reduced-motion: no-preference){ #pulls.fresh{animation:pflash 1.2s ease-out 2} @keyframes pflash{0%{box-shadow:0 0 0 3px var(--accent),0 0 30px rgba(214,190,140,.55)}100%{box-shadow:0 0 0 1px rgba(214,190,140,.12),0 0 18px rgba(214,190,140,.1)}} }

/* bottom navigation */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(22,19,20,.97);border-top:1px solid #2A2523;padding:6px 8px calc(14px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
#nav .in{display:flex;width:100%;max-width:760px}
#nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:500}
#nav button[aria-selected="true"]{color:var(--accent);font-weight:600}
#nav .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;font-size:11px;font-weight:700;line-height:18px;text-align:center;color:var(--accent-ink)}
.view{display:none}.view.on{display:block}

/* slot card (bottom sheet) */
#sheet{position:fixed;inset:0;z-index:30}
#sheet[hidden]{display:none}
#scrim{position:absolute;inset:0;background:rgba(8,6,6,.62)}
#panel{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-top:1px solid var(--line-2);border-radius:22px 22px 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.45);padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:no-preference){ #sheet:not([hidden]) #panel{animation:sheetup .26s cubic-bezier(.2,.8,.2,1)} #sheet:not([hidden]) #scrim{animation:fadein .2s ease-out} }
@keyframes sheetup{from{transform:translateY(40%);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.grab{display:block;width:40px;height:5px;border-radius:99px;background:#4A413C;margin:0 auto 12px;border:0;padding:0}
.grabzone{display:flex;justify-content:center;padding:2px 0 4px;margin:-6px -20px 0;touch-action:none}
#detail{display:flex;flex-direction:column;gap:14px}
#detail .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#detail .top .cw{display:flex;flex-direction:column;gap:2px;min-width:0}
.code{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;letter-spacing:.03em;color:var(--accent)}
.where{font-size:13px;color:var(--muted)}
.xbtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;border:0;background:var(--panel-2);color:var(--muted)}
.wname{margin:0;font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.02;overflow-wrap:anywhere}
.wname.open{color:#7c7072;font-style:italic}
.wmeta{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hair{height:1px;background:var(--line)}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;align-self:flex-start;margin-top:4px}
.s-ok{color:var(--ok)}.s-low{color:var(--low)}.s-out{color:var(--out)}.s-unk{color:var(--muted)}.s-empty{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 14px;min-height:44px;color:var(--text);font-size:14px;font-weight:500}

/* cartoon guide */
.guide{display:flex;gap:8px;align-items:flex-end}
.guide .say{position:relative;flex:1;background:#262020;border:1px solid var(--line-2);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.42;color:var(--text);margin:0 0 22px}
.guide .say:before{content:"";position:absolute;left:-7px;bottom:18px;width:12px;height:12px;background:#262020;border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);transform:rotate(45deg)}
.guide .ava{width:94px;height:auto;flex:none;display:block}
.avbtn{flex:none;padding:0;border:0;background:none;line-height:0;border-radius:16px;touch-action:manipulation}
.avbtn:active .ava{transform:scale(.96)}
@media (prefers-reduced-motion:no-preference){ .guide .ava.fresh{animation:avapop .35s ease-out} .guide .ava-eyes{transform-origin:60px 63px;animation:avablink 5s infinite} }
.guide .ava{overflow:visible;cursor:pointer}
.ava .em{opacity:0}
@media (prefers-reduced-motion:no-preference){
.ava.e-sip .sipmove{animation:emsip 2.8s both var(--d,0s)}
.ava.e-pop .popmove{animation:empop 2.8s both var(--d,0s)} .ava.e-pop .popmove{opacity:1}
.ava.e-pop .cork{animation:emcork 2.8s both var(--d,0s)}
.ava.e-pop .foam circle{animation:emfoam 2.8s both var(--d,0s)}
.ava.e-pop .f1{--fx:-14px;--fy:-34px}.ava.e-pop .f2{--fx:10px;--fy:-40px}.ava.e-pop .f3{--fx:22px;--fy:-22px}.ava.e-pop .f4{--fx:-22px;--fy:-18px}.ava.e-pop .f5{--fx:2px;--fy:-48px}.ava.e-pop .f6{--fx:30px;--fy:-36px}
.ava.e-flip .flipmove{animation:emflip 2.8s both var(--d,0s)}
.ava.e-flip .smile{animation:emshow 2.8s both var(--d,0s)} .ava.e-flip .mouth{animation:emhide 2.8s both var(--d,0s)}
}
@keyframes emsip{0%{opacity:0;transform:translate(100px,150px)}12%{opacity:1;transform:translate(98px,132px)}38%,68%{opacity:1;transform:translate(89px,104px) rotate(-60deg)}88%{opacity:1;transform:translate(98px,132px)}100%{opacity:0;transform:translate(100px,150px)}}
@keyframes empop{0%{opacity:0;transform:translateY(24px)}10%{opacity:1;transform:translateY(0)}16%{transform:rotate(-5deg)}22%{transform:rotate(5deg)}28%{transform:rotate(-5deg)}34%{transform:rotate(5deg)}40%{transform:rotate(0) translateY(3px)}44%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(24px)}}
@keyframes emcork{0%,40%{transform:none;opacity:1}70%{transform:translate(4px,-62px);opacity:1}85%,100%{transform:translate(6px,-74px);opacity:0}}
@keyframes emfoam{0%,40%{opacity:0;transform:none}46%{opacity:1}80%{opacity:.9;transform:translate(var(--fx),var(--fy))}90%,100%{opacity:0;transform:translate(var(--fx),calc(var(--fy) + 10px))}}
@keyframes emflip{0%{opacity:0;transform:translateY(44px)}14%{opacity:1;transform:translateY(-4px)}20%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(44px)}}
@keyframes emshow{0%,14%{opacity:0}20%,82%{opacity:1}90%,100%{opacity:0}}
@keyframes emhide{0%,14%{opacity:1}20%,82%{opacity:0}90%,100%{opacity:1}}
@keyframes avapop{from{transform:translateY(6px) scale(.94)}to{transform:none}}
@keyframes avablink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* slot count + actions */
.cnt{display:flex;flex-direction:column;gap:8px}
.cnt .cn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cnt .cn b{font-family:var(--display);font-weight:700;font-size:58px;line-height:.9;font-variant-numeric:tabular-nums}
.cnt .cn span{font-size:15px;color:var(--muted)}
.cnt.zero .cn b{color:var(--out)} .cnt.part .cn b{color:var(--low)}
.cbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:99px;background:var(--text)}
.cnt.part .cbar i{background:var(--low)} .cnt.zero .cbar i{background:var(--out)}
.bld{font-size:13px;color:var(--muted);margin:0}
.bld b{color:var(--text);font-weight:600}
.acts{display:flex;flex-direction:column;gap:10px}
.took{min-height:60px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:600;letter-spacing:.01em;touch-action:manipulation}
.took:active{transform:scale(.985)}
.rst{min-height:50px;border:1px solid var(--line-2);border-radius:14px;background:none;color:var(--text);font-size:16px;font-weight:500}
.pick{border:1px solid var(--line);border-radius:14px;padding:12px;background:#171314}
.pick p{margin:0 0 10px;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pgrid button{min-height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;touch-action:manipulation}
.pgrid button.cur{border-color:var(--accent);color:var(--accent)}
.pfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}
.pfoot #pclose{margin-left:auto}
.pfoot button,.fstep button{color:var(--text)}
.fstep{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--bg)}
.fstep button{background:var(--panel-2);border:0;width:44px;min-height:42px;font-size:20px;font-weight:600}
.fstep span{min-width:40px;text-align:center;font-family:var(--display);font-size:22px;font-weight:600;color:var(--text);align-self:center}
.pfoot input{width:76px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px;font-size:16px;text-align:center}
.edit{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.edit h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wpick{position:relative}
.wlist{margin-top:6px;max-height:300px;overflow-y:auto;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);-webkit-overflow-scrolling:touch}
.wopt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;color:var(--text);font:inherit;cursor:pointer}
.wopt:last-child{border-bottom:0}
.wopt:hover,.wopt:focus-visible{background:rgba(214,190,140,.08);outline:none}
.wopt b{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2}
.wopt small{grid-column:1;font-size:12px;color:var(--muted)}
.wopt span{grid-column:2;grid-row:1/span 2;align-self:center;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.wopt span em{display:block;font-style:normal;font-size:15px;font-weight:600;color:var(--text)}
.wopt.act b{font-family:inherit;font-size:15px;color:var(--accent)}
.wopt.act.rm b{color:var(--red)}
#dName{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;font-family:var(--serif);font-size:20px;font-weight:600}
.rowctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctl label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.step{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--bg)}
.step button{background:var(--panel-2);border:0;width:46px;font-size:22px;font-weight:600}
.step input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:0;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;padding:6px 0}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;width:min(560px,calc(100% - 24px));display:flex;gap:10px;align-items:center;background:#2C2624;border:1px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.55);font-size:15px}
#toast[hidden]{display:none}
#toast span{flex:1;min-width:0}
#toast button{flex:none;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:none;color:var(--accent);font-size:15px;font-weight:600}
#toast.err{border-color:var(--out)}

/* page headers for Restock and Manage */
.ph2{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 0}
.ph2 h2{margin:0;font-family:var(--serif);font-weight:600;font-size:34px;line-height:1}
.ph2 p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.ibtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:12px;background:none;color:var(--muted)}
.subseg{margin:14px 0 4px}
.wallh{display:flex;align-items:baseline;justify-content:space-between;padding:16px 2px 6px}
.wallh b{font-family:var(--serif);font-weight:600;font-size:21px}
.wallh span{font-size:12px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:58px;width:100%;border:0;border-top:1px solid #2A2523;background:none;text-align:left;color:var(--text);padding:6px 2px}
.lrow .lc{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;color:var(--accent)}
.lrow .lm{display:flex;flex-direction:column;gap:1px;min-width:0}
.lrow .lm b{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lm small{font-size:12.5px;color:var(--muted)}
.lrow .lm small.r{color:var(--out);font-weight:500}
.lrow .lm small.a{color:var(--low)}
.lrow .lq{display:flex;flex-direction:column;align-items:flex-end}
.lrow .lq b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.lrow .lq span{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lrow .lq.r span,.lrow .lq.r b{color:var(--out)}
.empty{color:var(--muted);padding:18px 2px}
#copyOut{width:100%;min-height:120px;background:var(--bg);color:var(--text);border:1px solid var(--line-2);border-radius:10px;margin-top:8px;display:none;font:13px/1.4 ui-monospace,monospace;padding:8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 10px}

/* Manage */
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.acct span{font-size:14px;color:var(--muted)}
.acct .abtns{display:flex;gap:8px;flex:none}
#alertrow{flex-wrap:wrap}
#acctp{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:14px;margin-top:10px}
#acctp label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px}
#acctp input{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;font-size:16px}
#acctp h2{font-family:var(--serif);font-size:22px;margin:14px 0 6px}
.erow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.erow span{flex:1;min-width:0;overflow-wrap:anywhere}
.sub{display:none}.sub.on{display:block}
.solo [data-ms="usage"]{display:none}
#src{margin:16px 2px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;font-weight:600}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.sheetwrap{overflow-x:auto}
.cell{display:flex;gap:6px;align-items:baseline;background:none;border:0;padding:0;text-align:left;width:100%;color:var(--text)}
.cell span{font-family:var(--serif);font-weight:600;font-size:16px}
.cell small{color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--body);font-weight:400;font-size:12px}
.rown{font-family:var(--display);font-weight:600;font-size:16px;color:var(--accent)}
.sec2{font-family:var(--serif);font-size:24px;font-weight:600;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:#5E5752}.d-low{background:var(--low)}.d-out{background:var(--out)}.d-unk{background:transparent;border:1px solid var(--unk)}.d-empty{background:transparent;border:1px dashed var(--unk)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.cntin{display:flex;flex-direction:column;gap:3px}
.cntin span{font-size:13px;line-height:1.2;overflow-wrap:anywhere;font-family:var(--serif);font-weight:600;font-size:15px}
.cntin input{width:100%;max-width:90px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:7px 6px;font-family:var(--display);font-size:20px;font-weight:600;text-align:center}
.cntin input.set{border-color:var(--accent)}
.rv{display:flex;gap:10px;align-items:center;padding:10px 0 10px 10px;border-top:1px solid var(--line);border-left:3px solid transparent}
.rv.flag{border-left-color:var(--out);background:rgba(239,100,87,.06)}
.rv .ri{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--text)}
.rv .ri b{font-family:var(--serif);font-size:18px;font-weight:600;overflow-wrap:anywhere}
.rv .ri .rcode{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent)}
.rv .ri small{color:var(--muted);font-size:13px}
.rv .ri .why{color:var(--out);font-size:13px;font-weight:600}
.rv .ok,.rv .no{flex:none;min-height:44px;min-width:50px;border-radius:10px;background:none;font-size:14px;font-weight:600;padding:0 12px}
.rv .ok{border:1px solid var(--accent);color:var(--accent)}
.rv .no{border:1px solid var(--out);color:var(--out)}
.rvh{font-family:var(--serif);font-size:20px;font-weight:600;margin:18px 0 4px;color:var(--muted)}
#moved{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
#legend,#lookbtn{display:none!important}
#wall{position:relative}
</style>
</head>

<p id="moved" hidden>This is your private Claude copy. Staff use <a href="https://tocamaderawine.github.io">tocamaderawine.github.io</a>, and changes made here don't reach it.</p>

<section class="view on" id="v-tower" aria-label="Find">
<header>
  <div class="brand"><small>Toca Madera</small><h1>Wine Tower</h1></div>
  <span class="livestat"><i aria-hidden="true"></i><span id="sync">Loading…</span></span>
</header>
<div id="pills"></div>
<section id="pulls" hidden aria-live="polite" aria-label="Wines to pull"></section>
<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A89D93" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg><span class="sr">Find a wine or slot</span><input id="search" type="search" placeholder="Find a wine or slot" autocomplete="off"></label>
<div id="results"></div>
<div class="seg" id="modes" role="group" aria-label="Tower view"><button data-m="wall" aria-pressed="true">Wall</button><button data-m="in" aria-pressed="false">Inside</button><button data-m="out" aria-pressed="false">Outside</button></div>
<div class="wallrow">
  <button id="wprev" aria-label="Previous wall"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <div class="wt" aria-live="polite"><b id="wtitle">100s wall</b><span id="wsub"></span></div>
  <button id="wnext" aria-label="Next wall"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<div id="wall"></div>
<div id="stage" hidden>
  <canvas id="cv"></canvas>
  <div class="zoom">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zfit" aria-label="Show whole tower" style="font-size:13px">FIT</button>
  </div>
</div>
<p class="hint" id="hint"></p>
<div id="legend" hidden></div><button id="lookbtn" hidden></button>
</section>

<section class="view" id="v-restock" aria-label="Restock"></section>

<section class="view" id="v-manage" aria-label="Manage">
  <div class="ph2"><div><h2>Manage</h2><p>Counts, usage and tap review.</p></div></div>
  <div class="acct" id="acctrow" hidden><span id="whoami">Managers sign in to edit and review.</span><button id="acct" class="btn">Sign in</button></div>
  <div id="acctp" hidden></div>
  <div class="acct" id="alertrow" hidden><span id="alertmsg"></span><div class="abtns" id="alertbtns"></div></div>
  <div class="seg subseg" id="mseg" role="tablist" aria-label="Manage"><button role="tab" data-ms="sheet" aria-selected="true">Count</button><button role="tab" data-ms="usage" aria-selected="false">Usage</button><button role="tab" data-ms="review" id="revtab" aria-selected="false" hidden>Review</button></div>
  <div class="sub on" id="v-sheet"></div>
  <div class="sub" id="v-usage"></div>
  <div class="sub" id="v-review"></div>
  <p class="note" id="src"></p>
</section>

<div id="sheet" hidden><div id="scrim"></div><section id="panel" role="dialog" aria-modal="true" aria-label="Wine slot"><div class="grabzone" id="grab"><span class="grab"></span></div><div id="detail"></div></section></div>
<div id="toast" role="status" hidden></div>
<nav id="nav" aria-label="Main"><div class="in">
  <button data-v="tower" aria-selected="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>Find</button>
  <button data-v="restock" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"></path><path d="M4 14v5h16v-5"></path></svg>Restock<span class="badge" id="bRestock" hidden></span></button>
  <button data-v="manage" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Manage<span class="badge" id="bManage" hidden></span></button>
</div></nav>

    const fallback=()=>{ out.style.display="block"; out.value=txt; out.select(); msg.textContent="Select the text below and copy it."; };
    try{ navigator.clipboard.writeText(txt).then(()=>{ msg.textContent="Copied."; },fallback); }catch(e){ fallback(); } };
}
document.getElementById("v-restock").addEventListener("click",e=>{ const s=e.target.closest("[data-rs]"); if(s){ RSEG=s.dataset.rs; renderRestock(); return; } const b=e.target.closest("[data-slot]"); if(b&&S.slots[b.dataset.slot]) openSlot(b.dataset.slot); });
function renderUsage(){
  const since=Date.now()-usageDays*864e5, by={};
  for(const ev of S.log){ if(ev.d>=0||ev.t<since||ev.src==="bev") continue; const nm=(ev.src==="toast"&&slot(ev.id).n)||ev.n||ev.id, k=nm.toLowerCase(); (by[k]=by[k]||{n:nm,q:0,last:0}); by[k].q=Math.round((by[k].q-ev.d)*100)/100; by[k].last=Math.max(by[k].last,ev.t); }
  const rows=Object.values(by).sort((a,b)=>b.q-a.q), max=rows.length?rows[0].q:1, total=rows.reduce((a,r)=>a+r.q,0);
  let h=`<div class="toolbar"><div class="seg">${[7,30,90].map(d=>`<button data-d="${d}" aria-pressed="${d===usageDays}">${d} days</button>`).join("")}</div><span class="note" style="margin:0">${total} bottles pulled</span></div>`;
  if(!rows.length) h+=`<p class="empty">No bottles pulled in this window. Every Took one tap is logged here.</p>`;
  else h+=`<table><thead><tr><th>Wine</th><th class="num">Pulled</th><th class="num">Per week</th><th class="num">Last</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${esc(r.n)}<div class="bar"><i style="width:${Math.round(r.q/max*100)}%"></i></div></td><td class="num">${r.q}</td><td class="num">${(r.q/usageDays*7).toFixed(1)}</td><td class="num">${new Date(r.last).toLocaleDateString(undefined,{month:"numeric",day:"numeric"})}</td></tr>`).join("")+`</tbody></table>`;
  const el=document.getElementById("v-usage"); el.innerHTML=h;
  el.querySelector(".seg").onclick=e=>{ const b=e.target.closest("button"); if(b){ usageDays=+b.dataset.d; renderUsage(); } };
}
function shortWhere(id){
  const s=slotList().find(x=>x.id===id); if(!s||!LAY[s.sec.id]) return "";
  const side=["on your left","straight ahead","on your right"][FACE_OF[s.sec.id]]||"", n=s.sec.cols.length, ci=s.sec.cols.indexOf(s.col), L=LAY[s.sec.id], ri=s.sec.rows.indexOf(s.row);
  return s.sec.id+"s wall "+side+", "+(n<2?"":(ci===0?"left":ci===n-1?"right":"middle")+" spot, ")+"row "+(ri+1)+(L.y[ri]+L.h[ri]/2>doorU()?", needs the ladder":"");
}
function renderResults(){
  const el=document.getElementById("results"); if(!HIT){ el.innerHTML=""; return; }
  const ids=slotList().map(s=>s.id).filter(id=>HIT.has(id));
  if(!ids.length){ el.innerHTML=`<p class="note">Nothing in the tower matches “${esc(query)}”.</p>`; return; }
  el.innerHTML=ids.slice(0,8).map(id=>{ const s=slot(id), st=status(id);
    return `<button class="res" data-slot="${id}"><i class="dot d-${st}"></i><span class="rn"><b>${esc(s.n||"open")}</b>${bevName(s)&&nrm(bevName(s))!==nrm(s.n)?`<small>${esc(bevName(s))}${s.vt?" · "+esc(s.vt):""}</small>`:""}<small>${esc(shortWhere(id))}</small></span><span class="rc"><b>${esc(id)}</b><small>${st==="empty"?"":onHand(id)==null?"not counted":onHand(id)<=0?"out":onHand(id)+" on hand"}${here(id)!=null?" · "+here(id)+" in slot":""}</small></span></button>`; }).join("")
    +(ids.length>8?`<p class="note">${ids.length-8} more. Keep typing to narrow it down.</p>`:"");
}
document.getElementById("results").onclick=e=>{ const b=e.target.closest("[data-slot]"); if(!b||!S.slots[b.dataset.slot]) return; openSlot(b.dataset.slot); };
function renderAll(keepFocus){ reindex(); relayout(); if(LIVE&&pulls.box.v) renderPulls(); renderSummary(); renderResults(); renderDetail(keepFocus); renderWall(); renderSheet(); renderRestock(); renderUsage(); renderReview(); draw(); }
let MSEG="sheet";
function showSub(){ document.querySelectorAll("#mseg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.ms===MSEG)); ["sheet","usage","review"].forEach(k=>document.getElementById("v-"+k).classList.toggle("on",k===MSEG)); }
function showView(v){ if(v==="sheet"||v==="usage"||v==="review"){ MSEG=v; showSub(); v="manage"; }
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v)); document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  if(v==="tower") resize(); else window.scrollTo(0,0); if(v==="restock") renderRestock(); if(v==="manage"&&LIVE&&AL.reg) alLoad(); }
document.getElementById("nav").onclick=e=>{ const b=e.target.closest("button[data-v]"); if(b){ if(CARD) closeSheet(); showView(b.dataset.v); } };
document.getElementById("mseg").onclick=e=>{ const b=e.target.closest("button[data-ms]"); if(b){ MSEG=b.dataset.ms; showSub(); } };
let searchT=null;
document.getElementById("search").addEventListener("input",e=>{ clearTimeout(searchT); const v=e.target.value.trim(); searchT=setTimeout(()=>{
  query=v; reindex(); const hits=slotList().filter(s=>matches(s.id));
  const one=hits.length&&hits.every(h=>{ const a=slot(h.id), b=slot(hits[0].id); return (a.w||a.n)===(b.w||b.n); });
  if(one){ sel=hits[0].id; renderAll(); if(document.getElementById("v-tower").classList.contains("on")) focusSlot(sel,true); } else renderAll();
},140); });
window.addEventListener("resize",resize);
if(!STANDALONE) document.getElementById("moved").hidden=false;

initStore(); resize(); setMode(mode);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
</script>
