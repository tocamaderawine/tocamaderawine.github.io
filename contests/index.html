<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toca Madera Contests</title>
<meta name="theme-color" content="#121011">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Contests">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Same look as the Wine Tower: warm charcoal, champagne gold. */
  color-scheme:dark;
  --bg:#121011;--panel:#1C1819;--panel-2:#252020;--sheet:#1A1617;--line:#2E2927;--line-2:#3A322E;
  --text:#F3EDE5;--muted:#A89D93;--accent:#D6BE8C;--accent-ink:#121011;--ok:#8FC2A4;--low:#E8A83E;--out:#EF6457;
  --serif:"Cormorant Garamond",Georgia,serif;--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:78px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;font-size:16px}
input[type=date]{min-height:46px}
textarea{resize:vertical;min-height:64px}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.wrap{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(var(--navh) + 40px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 4px 10px}
.kicker{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{margin:2px 0 0;font-family:var(--serif);font-weight:600;font-size:34px;line-height:1}
#live{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
#live i{width:7px;height:7px;border-radius:50%;background:var(--unk,#7c7072)}
#live.on i{background:var(--ok)}#live.bad i{background:var(--out)}
.acct{background:var(--panel-2);border:1px solid var(--line-2);border-radius:99px;padding:8px 14px;min-height:40px;font-size:14px;font-weight:500;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{display:none}.view.on{display:block}
.sec{font-family:var(--serif);font-size:24px;font-weight:600;margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
button.card{display:block;width:100%;text-align:left}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 14px;min-height:44px;font-size:14px;font-weight:500}
.btn.gold{border-color:var(--accent);color:var(--accent)}
.btn.danger{border-color:#5a2a26;color:var(--out)}
.primary{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.03em;margin-top:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--panel);border-radius:99px;padding:8px 14px;min-height:42px;font-size:15px;font-weight:500;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.sm{min-height:34px;padding:5px 11px;font-size:13px;color:var(--muted)}
.chip.sm[aria-pressed="true"]{color:var(--accent-ink)}
.chip b{font-family:var(--display);font-weight:700;margin-left:6px;opacity:.8}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.nm{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.nm b{display:block;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.nm small{color:var(--muted);font-size:12px}
.nm[aria-pressed="true"]{border-color:var(--accent);background:#2C2624;box-shadow:inset 0 0 0 1px var(--accent)}
.nm.add{border-style:dashed;color:var(--accent)}
.step{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);flex:none}
.step button{width:46px;height:46px;border:0;background:none;font-family:var(--display);font-size:24px;font-weight:600}
.step span{min-width:30px;text-align:center;font-family:var(--display);font-size:22px;font-weight:700}
.badge{display:inline-block;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;color:var(--muted);vertical-align:middle}
.badge.live{color:var(--ok);border-color:#2f4a3b}.badge.draw{color:var(--low);border-color:#5a4220}.badge.done{color:var(--accent);border-color:#5b4f37}
.ct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ct b.t{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.05;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.prize{color:var(--accent);font-size:14px;margin-top:6px}
.big{font-family:var(--display);font-weight:700;font-size:34px;line-height:.9;text-align:right;font-variant-numeric:tabular-nums}
.big small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.lb{margin-top:10px;border-top:1px solid var(--line)}
.lr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.lr .rk{width:24px;font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;flex:none}
.lr .nmx{flex:1;min-width:0;font-family:var(--serif);font-size:19px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .nmx small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);margin-left:6px}
.lr .n{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.lr .od{width:46px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.win{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,#2C2624,#221d1d);border:1px solid var(--accent);border-radius:12px;padding:12px;margin-top:10px}
.win svg{flex:none}
.win b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.05}
.win small{color:var(--muted);font-size:12px}
.er{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.er .ei{flex:1;min-width:0}
.er .ei b{font-family:var(--serif);font-size:18px;font-weight:600}
.er .ei div{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.er .q{font-family:var(--display);font-size:20px;font-weight:700;color:var(--accent)}
.er.gone{opacity:.45}.er.gone b{text-decoration:line-through}
.er .btn{min-height:38px;padding:4px 10px;font-size:13px}
.empty{border:1px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.empty .btn{margin-top:10px}
.banner{border:1px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:14px}
.banner span{flex:1}
.seg{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:#2C2624;color:var(--text);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.more summary{list-style:none;cursor:pointer;color:var(--muted);font-size:14px;padding:10px 2px}
details.more summary::-webkit-details-marker{display:none}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(22,19,20,.97);border-top:1px solid #2A2523;padding:6px 8px calc(14px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
#nav .in{display:flex;width:100%;max-width:760px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:500}
#nav button[aria-selected="true"]{color:var(--accent);font-weight:600}
#nav button[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .in{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--sheet);border:1px solid var(--line-2);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
#sheet h2{font-family:var(--serif);font-size:28px;font-weight:600;margin:0 0 4px;line-height:1.05;overflow-wrap:anywhere}
#sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#sheet .x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);font-size:20px;line-height:1}
#sheet .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#sheet .acts .btn{flex:1}
.reveal{text-align:center;padding:18px 0 6px}
.reveal .rn{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1.05;min-height:1.1em;overflow-wrap:anywhere}
.reveal.landed .rn{color:var(--accent)}
.reveal .rs{color:var(--muted);font-size:14px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;width:min(560px,calc(100% - 24px));display:flex;gap:10px;align-items:center;background:#2C2624;border:1px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#toast[hidden]{display:none}
#toast span{flex:1;min-width:0;font-size:15px}
#toast button{flex:none;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:none;color:var(--accent);font-size:15px;font-weight:600}
#toast button[hidden]{display:none}
#toast.err{border-color:var(--out)}
.err-t{color:var(--out);font-size:14px;margin-top:8px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">Toca Madera</div>
      <h1>Contests</h1>
      <div id="live"><i></i><span>Connecting…</span></div>
    </div>
    <button id="acct" class="acct" type="button">Sign in</button>
  </header>
  <main>
    <section id="v-log" class="view" aria-label="Log an entry">
      <div id="lg-banner"></div>
      <div id="lg-gate"></div>
      <div id="lg-form">
        <h2 class="sec">Contest</h2>
        <div id="lg-contests" class="chips"></div>
        <h2 class="sec">Who earned it</h2>
        <input id="lg-search" type="search" placeholder="Start typing a name" autocomplete="off" autocapitalize="words" enterkeyhint="done">
        <div id="lg-roles" class="chips" style="margin-top:10px"></div>
        <div id="lg-names" class="names"></div>
        <div class="row" style="margin-top:14px">
          <div class="step" aria-label="Entries"><button type="button" id="lg-minus" aria-label="One fewer">−</button><span id="lg-q">1</span><button type="button" id="lg-plus" aria-label="One more">+</button></div>
          <input id="lg-note" maxlength="80" placeholder="Note (optional)" autocomplete="off">
        </div>
        <button id="lg-add" class="primary" type="button" disabled>Add entry</button>
        <h2 class="sec">Recent entries <small id="lg-count"></small></h2>
        <div id="lg-recent"></div>
      </div>
    </section>
    <section id="v-contests" class="view" aria-label="Contests"></section>
    <section id="v-jackpot" class="view" aria-label="Jackpot"></section>
    <section id="v-roster" class="view" aria-label="Roster">
      <div id="ro-form">
        <h2 class="sec">Add to roster</h2>
        <div class="row"><input id="ro-name" maxlength="60" placeholder="Name (first + last initial)" autocomplete="off" autocapitalize="words" enterkeyhint="done"></div>
        <div id="ro-roles" class="chips" style="margin-top:10px"></div>
        <button id="ro-add" class="primary" type="button" disabled>Add</button>
      </div>
      <div id="ro-list"></div>
    </section>
  </main>
</div>
<nav id="nav" aria-label="Main"><div class="in">
  <button type="button" data-v="log" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Log</button>
  <button type="button" data-v="contests" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8.5 20h7M10 17h4"/></svg>Contests</button>
  <button type="button" data-v="jackpot" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4V8z"/><path d="M14.5 7v10" stroke-dasharray="1.6 2"/></svg>Jackpot</button>
  <button type="button" data-v="roster" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><circle cx="16.5" cy="9" r="2.6"/><path d="M15.5 14.6c2.3-.2 4.3 1.1 5 3.9"/></svg>Roster</button>
</div></nav>
<div id="sheet" hidden><div class="in" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden role="status"><span></span><button type="button" hidden></button></div>
<script src="../config.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
